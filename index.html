function fin(type){const m=S.menu,t=cart(m.pl).t,pts=Math.floor(t*2*(S.sub?1.25:1)),L={store:'a la botiga',home:'a domicili',pickup:'amb recollida'}[type];S.ord={id:m.id,type,t,pts,det:type==='home'?S.addr||'Carrer de Prova 1 (fictícia)':type==='pickup'?S.shop:'Targeta client'};if(add('super',pts,'Compra planificada '+L+' · '+MONEY(t),'b:'+m.id)){S.spent+=t;miss('buy');chal()}else{S.ord.dup=1;fx('Compra ja comptabilitzada','t')}}
function sim(k,a){if(lock)return;lock=true;setTimeout(()=>lock=false,600);add(k,Math.floor(a*2*(S.sub?1.25:1)),{super:'Compra al supermercat',oil:'Repostatge EsclatOil',energia:'Factura Bonpreu Energia'}[k]+' · '+a+' €');if(k==='super')S.spent+=a;chal()}
function redeem(){const r=S.rd,n=r.a*100;if(lock)return;if(bal()<n){fx('Saldo insuficient','t');return}lock=true;setTimeout(()=>lock=false,700);S.red+=n;S.hist.unshift({l:'Bescanvi a '+DN[r.d],a:-n,k:'red',t:now()});S.vouch={c:'BT-'+(1000+S.hist.length*7919%9000)+'-DEMO',d:DN[r.d],a:r.a};miss('wallet');save()}

swap:(di,si)=>{const e=S.menu.pl[di][+si],c=cand(e[0],true).filter(i=>i!==e[1]);if(c.length)e[1]=c[(c.indexOf(e[1])+1)%c.length]||c[0]},

tick=setInterval(()=>{if(!playing)return;pt+=100;while(fired<TL.length&&TL[fired][0]<=pt){const st=TL[fired++];if(st[1])$('cap').textContent=st[1];ov(0);st[2]();render()}bar();if(pt>=END){playing=false;$('pp').textContent='▶ Reprodueix'}},100)}
else if(h!=='#qr'){persist=true;S=load();S.v='welcome';app.innerHTML='<div class="page"><div class="phone" id="ph"><div class="in" id="in"></div></div></div>';shown=bal();render()}
